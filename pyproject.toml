[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-inventory-agent"
version = "0.1.0"
description = "An evidence-backed inventory agent with read-only tools and evaluation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
inventory-agent = "inventory_agent.cli:main"

[tool.setuptools]
packages = ["inventory_agent"]
